<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>KenPOP Tap</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
    * { -webkit-tap-highlight-color: rgba(0,0,0,0); -webkit-user-select: none; user-select: none; outline: none; }
  body { background: #0f172a; color: white; text-align: center; font-family: sans-serif; padding: 20px; margin: 0; padding-bottom: 80px; }
  #stats { font-size: 36px; font-weight: bold; margin-bottom: 20px; }
  #logo { width: 220px; height: 220px; background: url('kenpop.png') no-repeat center; background-size: contain; border: none; margin: 20px auto; display: block; transition: transform 0.1s; cursor: pointer; }
  #logo:active { transform: scale(0.88); }
.shop { background: #1e293b; padding: 15px; border-radius: 15px; margin: 15px 0; }
.item { display: flex; justify-content: space-between; align-items: center; background: #334155; padding: 12px; border-radius: 10px; margin: 8px 0; }
.item span small { font-size: 12px; color: #94a3b8; }
  button { background: gold; color: black; border: none; padding: 10px 15px; border-radius: 10px; font-weight: bold; cursor: pointer; }
  button:disabled { background: gray; cursor: not-allowed; }
.tukar { background: #22c55e; color: white; width: 100%; margin-top: 10px; }
  #float { position: absolute; color: gold; font-size: 26px; font-weight: 900; animation: float 0.8s forwards; pointer-events: none; }
  @keyframes float { from {opacity:1; transform: translateY(0);} to {opacity:0; transform: translateY(-50px);} }

  #bannerBox {
    width: 100%; min-height: 60px; background: #1e293b; border: 3px solid #fb923c;
    border-radius: 15px; margin: 15px 0; display: flex; justify-content: center; align-items: center; overflow: hidden; padding: 5px 0;
  }
</style>
</head>
<body>

<div id="stats">Koin: <span id="coins">0</span></div>
<button id="logo"></button>

<div class="shop">
  <h2>🛒 SHOP</h2>
  <div class="item">
    <span>Klik +1<br><small>Total = +<span id="powerNow">1</span></small></span>
    <button id="btnPower">VALIDASI</button>
  </div>
  <div class="item">
    <span>Auto Click 1 Jam</span>
    <button id="btnAuto">VALIDASI</button>
  </div>
  <button class="tukar" onclick="tukar()">🍗 TUKAR MAKAN</button>
</div>

<div id="bannerBox">
<script type="text/javascript">
	atOptions = {
	'key' : 'c68d59594618ef2d0218af656ac91b4c',
	'format' : 'iframe', 'height' : 50, 'width' : 320, 'params' : {}
	};
</script>
<script type="text/javascript" src="//www.highrevenueformat.com/c68d59594618ef2d0218af656ac91b4c/invoke.js"></script>
</div>

<script>
let tg = window.Telegram.WebApp; tg.expand();

// CEK RESET HARIAN JAM 00:00
let today = new Date().toISOString().split('T')[0];
let lastLogin = localStorage.lastLogin || "";
if(lastLogin!== today){
  localStorage.power = 1; localStorage.pAds = 0; localStorage.aAds = 0;
  localStorage.lastLogin = today; localStorage.lastAdTime = Date.now();
  localStorage.pTimer = 0; localStorage.aTimer = 0;
  localStorage.pStep = 1; localStorage.aStep = 1; // RESET STEP
  alert('Selamat Pagi! Bonus Klik +1 direset ke +1');
}

let coins = +localStorage.coins || 0;
let power = +localStorage.power || 1;
let auto = +localStorage.auto || 0;
let pAds = +localStorage.pAds || 0; // 0,1,2
let aAds = +localStorage.aAds || 0; // 0,1,2
let autoEnd = +localStorage.autoEnd || 0;
let lastAdTime = +localStorage.lastAdTime || Date.now();
let pTimer = +localStorage.pTimer || 0;
let aTimer = +localStorage.aTimer || 0;
let pStep = +localStorage.pStep || 1; // 1,2,3
let aStep = +localStorage.aStep || 1; // 1,2,3

let coinsTxt = document.getElementById('coins');
let powerNowTxt = document.getElementById('powerNow');
let btnPower = document.getElementById('btnPower');
let btnAuto = document.getElementById('btnAuto');

function showAd() {
  let s = document.createElement('script');
  s.dataset.zone = '11780928';
  s.src = 'https://al5sm.com/tag.min.js';
  document.body.appendChild(s);
  lastAdTime = Date.now(); localStorage.lastAdTime = lastAdTime;
}

document.getElementById('logo').onclick = (e) => {
  let totalKlik = power + auto;
  coins += totalKlik; showPlus('+'+totalKlik, e); save();
}

// === LOGIKA BARU V24: 3 KLIK PER VALIDASI ===
function handleValidasi(type){
  let now = Date.now();
  let ads = type==='power'? pAds : aAds;
  let step = type==='power'? pStep : aStep;
  let timer = type==='power'? pTimer : aTimer;

  if(timer > now) return; // Lagi cooldown, diabaikan
  if(ads >= 3) return;

  if(step === 1){
    // KLIK 1: UMPAN DOANG
    step++;
  }
  else if(step === 2){
    // KLIK 2: BUKA IKLAN
    showAd();
    ads++;
    step++;
  }
  else if(step === 3){
    // KLIK 3: BUKA IKLAN + MULAI COOLDOWN 15S
    showAd();
    ads++;
    timer = now + 15000; // Kunci 15 detik

    // Kalau udah 3/3 langsung naik
    if(ads >= 3){
      if(type==='power' && power < 50){
        power++;
        alert(`Klik +1 Naik! Sekarang Total = +${power}`);
      }
      if(type==='auto'){
        auto=power; autoEnd=now+3600000;
        alert('Auto Aktif 1 Jam!');
      }
      ads = 0; // Reset
    }
    step = 1; // Reset step
  }

  // Simpan balik
  if(type==='power'){ pAds=ads; pStep=step; pTimer=timer; }
  else { aAds=ads; aStep=step; aTimer=timer; }
  save();
}

btnPower.onclick = () => handleValidasi('power');
btnAuto.onclick = () => handleValidasi('auto');

function formatTime(ms) {
  let totalSec = Math.floor(ms / 1000);
  let hours = Math.floor(totalSec / 3600);
  let minutes = Math.floor((totalSec % 3600) / 60);
  let seconds = totalSec % 60;
  return `${hours}j ${minutes}m ${seconds}d`;
}

function showPlus(txt,e){
  let d=document.createElement('div'); d.id='float'; d.innerText=txt;
  d.style.left=e.clientX-20+'px'; d.style.top=e.clientY-20+'px';
  document.body.appendChild(d); setTimeout(()=>d.remove(),800);
}

function save(){
  let now = Date.now();
  if(now > autoEnd && auto > 0){ auto = 0; aAds = 0; aStep = 1; aTimer = 0; }
  if(now - lastAdTime >= 300000){ showAd(); }

  localStorage.coins=coins; localStorage.power=power; localStorage.auto=auto;
  localStorage.pAds=pAds; localStorage.aAds=aAds; localStorage.autoEnd=autoEnd;
  localStorage.pTimer=pTimer; localStorage.aTimer=aTimer;
  localStorage.pStep=pStep; localStorage.aStep=aStep;

  coinsTxt.innerText=coins.toLocaleString('id');
  powerNowTxt.innerText = power;

  // UPDATE TOMBOL POWER
  if(pTimer > now){
    let sisa = Math.ceil((pTimer - now)/1000);
    btnPower.innerText = `TUNGGU ${sisa}s...`;
    btnPower.disabled = true;
  } else {
    btnPower.disabled = false;
    if(power >= 50){ btnPower.innerText = "✅ MAX 50"; btnPower.disabled = true; }
    else if(pStep === 1){ btnPower.innerText = `VALIDASI ${pAds}/3`; }
    else { btnPower.innerText = `KLIK LAGI ${pAds}/3`; }
  }

  // UPDATE TOMBOL AUTO
  if(aTimer > now){
    let sisa = Math.ceil((aTimer - now)/1000);
    btnAuto.innerText = `TUNGGU ${sisa}s...`;
    btnAuto.disabled = true;
  } else if(now < autoEnd && auto > 0){
    let sisa = autoEnd - now;
    btnAuto.innerText = `⏰ ${formatTime(sisa)}`;
    btnAuto.disabled = true;
  } else {
    btnAuto.disabled = false;
    if(aStep === 1){ btnAuto.innerText = `VALIDASI ${aAds}/3`; }
    else { btnAuto.innerText = `KLIK LAGI ${aAds}/3`; }
  }
}

function tukar(){ if(coins >= 1000){ coins -= 1000; alert('Selamat! Tukar 1 Nasi. SS bukti dan chat admin KenPOP'); save(); } else { alert('Koin kurang. Butuh 1000 koin'); } }

setInterval(()=>{
  if(auto > 0 && Date.now() < autoEnd){ coins += power + auto; }
  save();
},1000);

save();
</script>
</body>
</html>
