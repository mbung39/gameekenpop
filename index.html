<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KenPOP Tap</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  body { background: #0f172a; color: white; text-align: center; font-family: sans-serif; padding: 20px; }
  #stats { font-size: 30px; font-weight: bold; margin-bottom: 20px; }
  #logo { width: 200px; height: 200px; background: url('kenpop.png') no-repeat center; background-size: contain; border: none; margin: 20px auto; cursor: pointer; }
  #logo:active { transform: scale(0.9); }
  .shop { background: #1e293b; padding: 15px; border-radius: 15px; margin: 15px 0; }
  .item { display: flex; justify-content: space-between; align-items: center; background: #334155; padding: 12px; border-radius: 10px; margin: 8px 0; }
  button { background: gold; color: black; border: none; padding: 10px 15px; border-radius: 10px; font-weight: bold; cursor: pointer; }
  button:disabled { background: gray; }
  .reset { background: red; color: white; width: 100%; margin-top: 10px; }
  .tukar { background: green; color: white; width: 100%; margin-top: 10px; }
</style>
</head>
<body>

<div id="stats">Koin: <span id="coins">0</span> | Level: <span id="level">1</span></div>

<button id="logo"></button>

<div class="shop">
  <h2>🛒 SHOP</h2>
  <div class="item">
    <span>Klik +1</span>
    <button id="btnPower">Nonton Iklan 0/3</button>
  </div>
  <div class="item">
    <span>Auto Click 1 Jam</span>
    <button id="btnAuto">Nonton Iklan 0/6</button>
  </div>
  <button class="reset" onclick="reset()">🔄 RESET GAME</button>
  <button class="tukar" onclick="tukar()">🍗 TUKAR MAKAN</button>
</div>

<div class="shop">
  <h2>🏆 TOP 10</h2>
  <div id="lb">1. Kamu - 0 koin</div>
</div>

<script>
let tg = window.Telegram.WebApp;
tg.expand();

let coins = +localStorage.coins || 0;
let power = +localStorage.power || 1;
let auto = +localStorage.auto || 0;
let pAds = +localStorage.pAds || 0; // power ads
let aAds = +localStorage.aAds || 0; // auto ads
let autoEnd = +localStorage.autoEnd || 0;
let watching = false;

// KLIK LOGO
document.getElementById('logo').onclick = (e) => {
  coins += power + auto;
  showPlus('+'+(power+auto), e);
  save();
}

// NONTON IKLAN POWER 3X
document.getElementById('btnPower').onclick = () => {
  if(pAds >= 3) return;
  if(watching) return alert('Tunggu iklan selesai dulu!');
  nontonIklan('power');
}

// NONTON IKLAN AUTO 6X
document.getElementById('btnAuto').onclick = () => {
  if(aAds >= 6) return;
  if(watching) return alert('Tunggu iklan selesai dulu!');
  nontonIklan('auto');
}

function nontonIklan(type){
  watching = true;
  let btn = type==='power' ? btnPower : btnAuto;
  let count = type==='power' ? pAds : aAds;
  let max = type==='power' ? 3 : 6;
  let timer = 15; // 15 detik aja biar cepet

  window.open('https://www.profitabledisplayformat.com/31204126/invoke.js','_blank'); // BUKA IKLAN
  btn.disabled = true;

  let x = setInterval(()=>{
    btn.innerText = `Tunggu ${timer}s...`;
    timer--;
    if(timer<0){
      clearInterval(x);
      watching = false;
      count++;
      if(type==='power') pAds = count;
      if(type==='auto') aAds = count;
      
      if(pAds>=3){ power++; pAds=0; alert('Klik +1 Aktif!'); }
      if(aAds>=6){ auto=power; autoEnd=Date.now()+3600000; alert('Auto Click Aktif 1 Jam!'); }
      save();
    }
  },1000);
}

function showPlus(txt,e){
  let d=document.createElement('div');
  d.innerText=txt; d.style="position:absolute;color:gold;font-size:24px;font-weight:bold;";
  d.style.left=e.clientX+'px'; d.style.top=e.clientY+'px';
  document.body.appendChild(d);
  setTimeout(()=>d.remove(),800);
}

function save(){
  localStorage.coins=coins; localStorage.power=power; localStorage.auto=auto;
  localStorage.pAds=pAds; localStorage.aAds=aAds; localStorage.autoEnd=autoEnd;
  coinsTxt.innerText=coins; levelTxt.innerText=Math.floor(coins/100)+1;
  
  btnPower.innerText = pAds>=3 ? "✅ Aktif" : `Nonton Iklan ${pAds}/3`;
  btnAuto.innerText = Date.now()<autoEnd ? "⏰ Aktif 1 Jam" : `Nonton Iklan ${aAds}/6`;
  
  if(Date.now()>autoEnd && auto>0){ auto=0; aAds=0; }
  
  lb.innerText = `1. Kamu - ${coins} koin`;
}

function reset(){
  if(confirm('Reset semua?')){
    localStorage.clear(); location.reload();
  }
}

function tukar(){
  if(coins >= 1000){
    coins -= 1000;
    alert('Selamat! Kamu bisa tukar 1 Nasi KenPOP. SS koin kamu dan chat admin ya!');
    save();
  } else {
    alert('Koin kurang! Butuh 1000 koin untuk tukar 1 Nasi KenPOP');
  }
}

let coinsTxt = document.getElementById('coins');
let levelTxt = document.getElementById('level');
let btnPower = document.getElementById('btnPower');
let btnAuto = document.getElementById('btnAuto');
let lb = document.getElementById('lb');

setInterval(save,1000); // update tiap detik buat auto click
save();
</script>
</body>
</html>
