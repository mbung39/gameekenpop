<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>KenPOP Tap</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<!-- 1. ADSTERRA SOCIAL BAR -->
<script type='text/javascript' src='//pl31204126.profitabledisplayformat.com/12/34/56/123456.js'></script>

<style>
    * { 
    margin: 0; padding: 0; box-sizing: border-box; 
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
  }
  body { 
    background: #1a1a2e; color: white; text-align: center; font-family: sans-serif; 
    min-height: 100vh; /* PENTING: pake min-height biar bisa scroll */
    padding: 10px;
    overflow-y: auto; /* BISA SCROLL KALO KEPANJANGAN */
  }
  #stats { 
    display: flex; justify-content: space-around; 
    font-size: 28px; font-weight: 900; padding: 10px 0; /* GEDEIN LAGI */
    position: sticky; top: 0; background: #1a1a2e; z-index: 10;
  }
  #btn { 
    width: 240px; height: 240px; /* BIKIN GEDE BANGET KAYAK SS */
    border: none; background: url('kenpop.png') no-repeat center; 
    background-size: contain; cursor: pointer; transition: 0.1s; outline: none; margin: 15px auto;
  }
  #btn:active { transform: scale(0.9); }
  .shop, .leaderboard { background: #2a2a4e; border-radius: 15px; padding: 12px; margin: 15px 10px; }
  .shop h3, .leaderboard h3 { font-size: 20px; margin-bottom: 10px; }
  .item { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: #3a3a5e; border-radius: 10px; margin: 8px 0; font-size: 16px; font-weight: bold; }
  .buy-btn { background: gold; color: black; border: none; padding: 8px 15px; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 15px; }
  .buy-btn:disabled { background: gray; color: #ccc; }
  #float { position: absolute; color: gold; font-weight: bold; font-size: 28px; animation: float 1s forwards; pointer-events: none; }
  @keyframes float { from {opacity:1; transform: translateY(0);} to {opacity:0; transform: translateY(-50px);} }
  #ad-banner { width: 300px; height: 250px; margin: 15px auto; }
</style>
</head>
<body>
  <div id="stats">
    <div>Koin: <span id="coins">0</span></div>
    <div>Level: <span id="level">1</span></div>
  </div>

  <button id="btn"></button>

  <!-- TEMPAT BANNER 300x250 -->
  <div id="ad-banner"></div>

  <div class="shop">
    <h3>🛒 SHOP</h3>
    <div class="item">
      <span>Klik +1</span> 
      <button class="buy-btn" id="btnPower" onclick="watchAdForPower()">Nonton Iklan 0/3</button>
    </div>
    <div class="item">
      <span>Auto Click</span> 
      <button class="buy-btn" id="btnAuto" onclick="watchAdForAuto()">Nonton Iklan 0/5</button>
    </div>
    <button onclick="resetGame()" style="background: red; color: white; border: none; padding: 10px; border-radius: 10px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 8px; font-size: 16px;">
      🔄 RESET GAME
    </button>
  </div>

  <div class="leaderboard">
    <h3>🏆 TOP 10</h3>
    <div id="lb">Loading...</div>
  </div>

<script>
let tg = window.Telegram.WebApp;
let coins = parseInt(localStorage.getItem('coins')) || 0;
let power = parseInt(localStorage.getItem('power')) || 1;
let auto = parseInt(localStorage.getItem('auto')) || 0;
let powerAdsWatched = parseInt(localStorage.getItem('powerAdsWatched')) || 0;
let autoAdsWatched = parseInt(localStorage.getItem('autoAdsWatched')) || 0;
let autoEndTime = parseInt(localStorage.getItem('autoEndTime')) || 0;
let lastAdTime = parseInt(localStorage.getItem('lastAdTime')) || 0;
let autoInterval;
let isWatchingAd = false;

// FUNGSI IKLAN 18 DETIK
function watchAdWithTimer(type, callback) {
  if(isWatchingAd) return alert('Tunggu iklan selesai dulu!');
  isWatchingAd = true;
  
  let btn = type === 'power' ? document.getElementById('btnPower') : document.getElementById('btnAuto');
  let count = type === 'power' ? powerAdsWatched : autoAdsWatched;
  
  btn.disabled = true;
  let timer = 18;

  if (typeof _pop === 'function') { _pop(); }
  lastAdTime = Date.now();
  localStorage.setItem('lastAdTime', lastAdTime);

  let interval = setInterval(() => {
    btn.innerText = `Tunggu ${timer}s...`;
    timer--;
    if(timer < 0) {
      clearInterval(interval);
      isWatchingAd = false;
      callback();
      if(type === 'power') powerAdsWatched++;
      if(type === 'auto') autoAdsWatched++;
      updateUI();
    }
  }, 1000);
}

function updateUI() {
  document.getElementById('coins').innerText = coins.toLocaleString('id');
  document.getElementById('level').innerText = Math.floor(coins/100) + 1;
  
  if(powerAdsWatched >= 3) {
    document.getElementById('btnPower').innerText = "✅ Aktif";
    document.getElementById('btnPower').disabled = true;
  } else {
    document.getElementById('btnPower').innerText = `Nonton Iklan ${powerAdsWatched}/3`;
  }

  if(autoAdsWatched >= 5 && Date.now() < autoEndTime) {
    document.getElementById('btnAuto').innerText = "⏰ Aktif 1 Jam";
    document.getElementById('btnAuto').disabled = true;
  } else if(autoAdsWatched >= 5) {
    document.getElementById('btnAuto').innerText = `Nonton Iklan ${autoAdsWatched}/5`;
    document.getElementById('btnAuto').disabled = true;
  } else {
    document.getElementById('btnAuto').innerText = `Nonton Iklan ${autoAdsWatched}/5`;
  }
  
  localStorage.setItem('coins', coins);
  localStorage.setItem('power', power);
  localStorage.setItem('auto', auto);
  localStorage.setItem('powerAdsWatched', powerAdsWatched);
  localStorage.setItem('autoAdsWatched', autoAdsWatched);
  localStorage.setItem('autoEndTime', autoEndTime);
  localStorage.setItem('lastAdTime', lastAdTime);
  tg.sendData(JSON.stringify({coins, power, auto}));
}

// TAP
document.getElementById('btn').onclick = (e) => {
  coins += power;
  if(auto > 0) coins += auto;
  showFloat('+'+power, e);
  updateUI();
  tg.HapticFeedback.impactOccurred('light');
}

// FLOATING TEXT
function showFloat(text, e) {
  let float = document.createElement('div');
  float.id = 'float';
  float.innerText = text;
  float.style.left = e.clientX + 'px';
  float.style.top = e.clientY + 'px';
  document.body.appendChild(float);
  setTimeout(()=>float.remove(), 1000);
}

// 2. ADSTERRA BANNER 300x250
atOptions = { 'key' : '31204127', 'format' : 'iframe', 'height' : 250, 'width' : 300, 'params' : {} };
document.write('<scr' + 'ipt type="text/javascript" src="//www.profitabledisplayformat.com/31204127/invoke.js"></scr' + 'ipt>');

// NONTON IKLAN
function watchAdForPower() {
  if(powerAdsWatched >= 3) return;
  watchAdWithTimer('power', () => {
    if(powerAdsWatched + 1 >= 3) {
      power += 1;
      alert('Klik +1 Aktif Permanen!');
    }
  });
}

function watchAdForAuto() {
  if(autoAdsWatched >= 5) return;
  watchAdWithTimer('auto', () => {
    if(autoAdsWatched + 1 >= 5) {
      auto = power; 
      autoEndTime = Date.now() + 3600000; 
      startAuto();
      alert('Auto Click Aktif 1 Jam!');
    }
  });
}

// AUTO CLICK
function startAuto() {
  clearInterval(autoInterval);
  autoInterval = setInterval(()=>{
    if(auto > 0 && Date.now() < autoEndTime) { 
      coins += auto; 
      updateUI(); 
    }
    if(Date.now() > autoEndTime && auto > 0){
      auto = 0;
      autoAdsWatched = 0; 
      alert('Auto Click Habis. Nonton 5 iklan lagi!');
      updateUI();
    }
  }, 1000);
}

// IKLAN OTOMATIS 5 MENIT
setInterval(()=>{
  let now = Date.now();
  if(now - lastAdTime >= 300000){
    if (typeof _pop === 'function') { _pop(); }
    lastAdTime = now;
    localStorage.setItem('lastAdTime', lastAdTime);
  }
}, 60000);

// RESET GAME
function resetGame() {
  if(confirm('Yakin mau reset semua data?')) {
    localStorage.clear();
    coins = 0; power = 1; auto = 0;
    powerAdsWatched = 0; autoAdsWatched = 0;
    autoEndTime = 0; lastAdTime = 0;
    clearInterval(autoInterval);
    alert('Data berhasil di reset!');
    updateUI();
  }
}

// LEADERBOARD
function loadLB() {
  document.getElementById('lb').innerHTML = `1. Kamu - ${coins.toLocaleString('id')} koin<br>2. Player2 - 1.200 koin<br>3. Player3 - 800 koin`;
}

loadLB();
updateUI();
startAuto();
tg.expand();
</script>
</body>
</html>
