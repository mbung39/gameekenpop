<script>
let tg = window.Telegram.WebApp;
let user = tg.initDataUnsafe.user || {id: 123};
let coins = parseInt(localStorage.getItem('coins')) || 0;
let power = parseInt(localStorage.getItem('power')) || 1;
let auto = parseInt(localStorage.getItem('auto')) || 0;
let powerAdsWatched = parseInt(localStorage.getItem('powerAdsWatched')) || 0;
let autoAdsWatched = parseInt(localStorage.getItem('autoAdsWatched')) || 0;
let autoEndTime = parseInt(localStorage.getItem('autoEndTime')) || 0;
let lastAdTime = parseInt(localStorage.getItem('lastAdTime')) || 0; // buat timer 5 menit

function updateUI() {
  document.getElementById('coins').innerText = coins;
  document.getElementById('level').innerText = power;
  document.getElementById('btnPower').innerText = `Nonton Iklan ${powerAdsWatched}/3`;
  document.getElementById('btnAuto').innerText = `Nonton Iklan ${autoAdsWatched}/5`;
  
  if(powerAdsWatched >= 3) document.getElementById('btnPower').innerText = "✅ Aktif";
  if(autoAdsWatched >= 5 && Date.now() < autoEndTime) document.getElementById('btnAuto').innerText = "⏰ Aktif 1 Jam";
  
  localStorage.setItem('coins', coins);
  localStorage.setItem('power', power);
  localStorage.setItem('auto', auto);
  localStorage.setItem('powerAdsWatched', powerAdsWatched);
  localStorage.setItem('autoAdsWatched', autoAdsWatched);
  localStorage.setItem('autoEndTime', autoEndTime);
  localStorage.setItem('lastAdTime', lastAdTime);
  tg.sendData(JSON.stringify({coins, power, auto}));
}

// TAP
document.getElementById('btn').onclick = (e) => {
  coins += power;
  showFloat('+'+power, e);
  updateUI();
  tg.HapticFeedback.impactOccurred('light');
}

// FLOATING TEXT
function showFloat(text, e) {
  let float = document.createElement('div');
  float.id = 'float';
  float.innerText = text;
  float.style.left = e.clientX + 'px';
  float.style.top = e.clientY + 'px';
  document.body.appendChild(float);
  setTimeout(()=>float.remove(), 1000);
}
