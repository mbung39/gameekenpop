<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>💸 MONEY TAP 💸</title>
<style>
    * { box-sizing: border-box; font-family: Arial; -webkit-tap-highlight-color: transparent; }
  body {
    margin:0; padding:20px; text-align:center; 
    background: linear-gradient(135deg, #003300 0%, #006600 100%);
    color:#fff; min-height:100vh; overflow:hidden;
  }
  h1 { color: #FFD700; text-shadow: 0 0 10px #FFD700; }
  #koinDisplay {
    font-size:32px; font-weight:bold; color:#FFD700;
    background: rgba(0,0,0,0.7); padding:12px 20px; border-radius:20px;
    border: 2px solid #FFD700; margin:15px auto; width: fit-content;
  }
  #btnTap {
    width:200px; height:200px; border:none; border-radius:50%;
    background: radial-gradient(circle, #FFD700 0%, #FF8C00 100%);
    box-shadow: 0 0 30px #FFD700;
    cursor:pointer; margin:20px auto; font-size:80px;
  }
  #btnTap:active { transform: scale(0.9); }
 .btn-menu {
    background: #FFD700; color:#000; border:none; padding:12px 25px; 
    border-radius:25px; font-weight:bold; font-size:16px; margin:8px;
  }
 .popup { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); justify-content:center; align-items:center; z-index:99; }
 .popup-box { background:#002200; border:2px solid #FFD700; border-radius:15px; padding:15px; width:90%; }
 .popup-item { display:flex; justify-content:space-between; background:rgba(0,0,0,0.4); padding:10px; margin:8px 0; border-radius:10px; }
 .btn-tukar-popup { background:#FFD700; color:#000; border:none; padding:8px 12px; border-radius:8px; font-weight:bold; }
 .money { position:absolute; font-size:28px; animation: naik 0.7s forwards; pointer-events:none; }
  @keyframes naik { to {transform: translateY(-100px); opacity: 0;} }
</style>
</head>
<body>

<h1>💸 MONEY TAP 💸</h1>
<p>Uang! Kumpul Koin! Cair ke DANA/Gopay!</p>

<div id="koinDisplay">KOIIN: 0</div>

<button id="btnTap">💰</button>

<div>
  <button class="btn-menu" id="btnTukar">TUKAR SALDO</button>
  <button class="btn-menu" id="btnRiwayat">RIWAYAT</button>
</div>

<!-- POPUP TUKAR -->
<div class="popup" id="popupTukar">
  <div class="popup-box">
    <h2>TUKAR KE SALDO</h2>
    <div class="popup-item"><span>DANA 5.000<br><small>500.000 koin</small></span><button class="btn-tukar-popup" onclick="prosesTukar('DANA 5.000',500000)">TUKAR</button></div>
    <div class="popup-item"><span>GOPAY 10.000<br><small>1.000.000 koin</small></span><button class="btn-tukar-popup" onclick="prosesTukar('GOPAY 10.000',1000000)">TUKAR</button></div>
    <button class="btn-menu" style="background:#555; color:#fff;" onclick="tutup('popupTukar')">TUTUP</button>
  </div>
</div>

<!-- POPUP STRUK -->
<div class="popup" id="popupStruk"><div class="popup-box"><h2>BERHASIL</h2><div id="isiStruk"></div><button class="btn-menu" onclick="tutup('popupStruk')">OK</button></div></div>

<!-- POPUP HISTORY -->
<div class="popup" id="popupHistory"><div class="popup-box"><h2>RIWAYAT</h2><div id="isiHistory"></div><button class="btn-menu" style="background:#555; color:#fff;" onclick="tutup('popupHistory')">TUTUP</button></div></div>

<script>
var coins = 0;
var historyTukar = [];

// LOAD DATA SAAT BUKA
window.onload = function(){
  coins = parseInt(localStorage.getItem('moneyKoin')) || 0;
  historyTukar = JSON.parse(localStorage.getItem('moneyHistory')) || [];
  updateUI();
  
  // KAITKAN TOMBOL
  document.getElementById('btnTap').onclick = klik;
  document.getElementById('btnTukar').onclick = function(){buka('popupTukar')};
  document.getElementById('btnRiwayat').onclick = function(){buka('popupHistory')};
}

function klik(e){
  coins = coins + 1;
  updateUI();
  muncrat(e);
}

function muncrat(e){
  var duit = document.createElement('div');
  duit.className = 'money';
  duit.innerHTML = '💵';
  duit.style.left = e.clientX - 15 + 'px';
  duit.style.top = e.clientY - 15 + 'px';
  document.body.appendChild(duit);
  setTimeout(function(){duit.remove()}, 700);
}

function updateUI(){
  document.getElementById('koinDisplay').innerText = 'KOIIN: ' + coins.toLocaleString('id') + ' 💰';
  localStorage.setItem('moneyKoin', coins);
}

function buka(id){
  if(id == 'popupHistory'){
    var html = historyTukar.length == 0? 'Belum ada riwayat' : '';
    for(var i=0; i<historyTukar.length; i++){
      var h = historyTukar[i];
      html += '<div style="border-bottom:1px solid #FFD700; padding:5px 0;"><b>'+h.menu+'</b> - '+h.tgl+'<br>No: '+h.ewallet+'</div>';
    }
    document.getElementById('isiHistory').innerHTML = html;
  }
  document.getElementById(id).style.display = 'flex';
}

function tutup(id){ document.getElementById(id).style.display = 'none'; }

function prosesTukar(menu, harga){
  if(coins < harga){ alert('Koin kurang! Butuh ' + harga.toLocaleString('id') + ' koin'); return; }
  
  var nama = prompt("Nama Penerima:");
  if(!nama) return;
  var no = prompt("No DANA/GOPAY:");
  if(!no) return;
  
  coins = coins - harga;
  var d = new Date();
  var data = { 
    tgl: d.toLocaleDateString('id') + ' + d.toLocaleTimeString('id'),
    menu: menu, harga: harga, sisa: coins, nama: nama, ewallet: no 
  };
  
  historyTukar.unshift(data);
  localStorage.setItem('moneyHistory', JSON.stringify(historyTukar));
  
  document.getElementById('isiStruk').innerHTML = 
    '<b>Tanggal:</b> '+data.tgl+'<br><b>Nama:</b> '+data.nama+'<br><b>No:</b> '+data.ewallet+'<br><b>Tarik:</b> '+data.menu+'<br><b>Potong:</b> '+data.harga.toLocaleString('id')+' Koin';
  
  tutup('popupTukar');
  document.getElementById('popupStruk').style.display = 'flex';
  updateUI();
}
</script>
</body>
</html>
