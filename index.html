<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>KenPOP Tap</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
    * { 
    -webkit-tap-highlight-color: rgba(0,0,0,0); 
    -webkit-touch-callout: none; 
    -webkit-user-select: none; 
    user-select: none;
    outline: none;
  }
  body { background: #0f172a; color: white; text-align: center; font-family: sans-serif; padding: 20px; margin: 0; }
  #stats { font-size: 32px; font-weight: bold; margin-bottom: 20px; }
  #logo { 
    width: 220px; height: 220px; background: url('kenpop.png') no-repeat center; 
    background-size: contain; border: none; margin: 20px auto; cursor: pointer; display: block;
    transition: transform 0.1s;
  }
  #logo:active { transform: scale(0.88); }
  .shop { background: #1e293b; padding: 15px; border-radius: 15px; margin: 15px 0; }
  .item { display: flex; justify-content: space-between; align-items: center; background: #334155; padding: 12px; border-radius: 10px; margin: 8px 0; font-size: 16px; }
  button { background: gold; color: black; border: none; padding: 10px 15px; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 15px; }
  button:disabled { background: gray; color: #ccc; }
  .reset { background: #ef4444; color: white; width: 100%; margin-top: 10px; }
  .tukar { background: #22c55e; color: white; width: 100%; margin-top: 10px; }
  #float { position: absolute; color: gold; font-size: 26px; font-weight: 900; animation: float 0.8s forwards; pointer-events: none; text-shadow: 0 0 5px #000; }
  @keyframes float { from {opacity:1; transform: translateY(0);} to {opacity:0; transform: translateY(-50px);} }
</style>
</head>
<body>

<div id="stats">Koin: <span id="coins">0</span> | Level: <span id="level">1</span></div>

<button id="logo"></button>

<div class="shop">
  <h2>🛒 SHOP</h2>
  <div class="item">
    <span>Klik +1</span>
    <button id="btnPower">Nonton Iklan 0/3</button>
  </div>
  <div class="item">
    <span>Auto Click 1 Jam</span>
    <button id="btnAuto">Nonton Iklan 0/6</button>
  </div>
  <button class="reset" onclick="reset()">🔄 RESET GAME</button>
  <button class="tukar" onclick="tukar()">🍗 TUKAR MAKAN</button>
</div>

<div class="shop">
  <h2>🏆 TOP 10</h2>
  <div id="lb">1. Kamu - 0 koin</div>
</div>

<script>
let tg = window.Telegram.WebApp;
tg.expand();

let coins = +localStorage.coins || 0;
let power = +localStorage.power || 1;
let auto = +localStorage.auto || 0;
let pAds = +localStorage.pAds || 0;
let aAds = +localStorage.aAds || 0;
let autoEnd = +localStorage.autoEnd || 0;
let watching = false;

let coinsTxt = document.getElementById('coins');
let levelTxt = document.getElementById('level');
let btnPower = document.getElementById('btnPower');
let btnAuto = document.getElementById('btnAuto');
let lb = document.getElementById('lb');

// KLIK LOGO
document.getElementById('logo').onclick = (e) => {
  coins += power + auto;
  showPlus('+'+(power+auto), e);
  save();
}

// NONTON IKLAN POWER 3X
btnPower.onclick = () => {
  if(pAds >= 3) return alert('Klik +1 sudah aktif!');
  if(watching) return alert('Tunggu iklan selesai dulu!');
  nontonIklan('power');
}

// NONTON IKLAN AUTO 6X
btnAuto.onclick = () => {
  if(aAds >= 6) return alert('Auto Click sudah aktif!');
  if(watching) return alert('Tunggu iklan selesai dulu!');
  nontonIklan('auto');
}

function nontonIklan(type){
  watching = true;
  let btn = type==='power' ? btnPower : btnAuto;
  let timer = 15;

  // FIX 1: BUKA IKLAN PAKE <a> BIAR GAK KE-BLOKIR GOOGLE
  let link = document.createElement('a');
  link.href = 'https://www.profitabledisplayformat.com/31204126/invoke.js';
  link.target = '_blank';
  link.click();
  
  btn.disabled = true;

  let x = setInterval(()=>{
    btn.innerText = `Tunggu ${timer}s...`;
    timer--;
    if(timer<0){
      clearInterval(x);
      watching = false; // FIX 2: PASTIIN WATCHING KE-RESET
      btn.disabled = false; // BUKA LAGI TOMBOLNYA
      
      if(type==='power') pAds++;
      if(type==='auto') aAds++;
      
      if(pAds>=3){ power++; pAds=0; alert('Klik +1 Aktif Permanen!'); }
      if(aAds>=6){ auto=power; autoEnd=Date.now()+3600000; aAds=0; alert('Auto Click Aktif 1 Jam!'); }
      save();
    }
  },1000);
}

function showPlus(txt,e){
  let d=document.createElement('div');
  d.id = 'float';
  d.innerText=txt;
  d.style.left=e.clientX-20+'px'; 
  d.style.top=e.clientY-20+'px';
  document.body.appendChild(d);
  setTimeout(()=>d.remove(),800);
}

function save(){
  if(Date.now()>autoEnd && auto>0){ auto=0; aAds=0; }
  
  localStorage.coins=coins; 
  localStorage.power=power; 
  localStorage.auto=auto;
  localStorage.pAds=pAds; 
  localStorage.aAds=aAds; 
  localStorage.autoEnd=autoEnd;
  
  coinsTxt.innerText=coins.toLocaleString('id'); 
  levelTxt.innerText=Math.floor(coins/100)+1;
  
  btnPower.innerText = pAds>=3 ? "✅ Aktif" : `Nonton Iklan ${pAds}/3`;
  btnAuto.innerText = Date.now()<autoEnd ? "⏰ Aktif 1 Jam" : `Nonton Iklan ${aAds}/6`;
  
  lb.innerText = `1. Kamu - ${coins.toLocaleString('id')} koin`;
}

function reset(){
  if(confirm('Reset semua data?')){
    localStorage.clear(); 
    location.reload();
  }
}

function tukar(){
  if(coins >= 1000){
    coins -= 1000;
    alert('Selamat! Kamu bisa tukar 1 Nasi KenPOP. SS koin kamu dan chat admin ya!');
    save();
  } else {
    alert('Koin kurang! Butuh 1000 koin untuk tukar 1 Nasi KenPOP');
  }
}

// AUTO CLICK JALAN TIAP DETIK
setInterval(()=>{
  if(auto > 0 && Date.now() < autoEnd){
    coins += auto;
  }
  save();
},1000);

save();
</script>
</body>
</html>
